<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Director's Cut</title>
  <meta name="description" content="University application portfolio">
  <meta name="theme-color" content="#0a0908">

  <!-- Set the theme before first paint (no flash). Saved choice, else the projection room (dark). -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('ex6-theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    })();
  </script>

  <!-- Fonts: Big Shoulders Display (titles) + Newsreader (reading) + Courier Prime (screenplay) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300..900&family=Courier+Prime:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../shared/iamwar.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" id="skipLink" href="#main"></a>

  <!-- Intro: a film-leader countdown (skippable, ~2.1s) -->
  <div class="loader" id="loader" role="status" aria-live="polite">
    <div class="loader__wipe" aria-hidden="true"></div>
    <div class="loader__cross" aria-hidden="true"></div>
    <svg class="loader__ring" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="92"/><circle cx="100" cy="100" r="70"/></svg>
    <div class="loader__num" id="loaderNum" aria-hidden="true">3</div>
    <p class="loader__label"><span id="loaderName"></span> · <span id="loaderLabel"></span></p>
    <button class="loader__skip" id="loaderSkip" type="button"></button>
  </div>

  <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="site-header" id="header">
    <a class="brand" id="brand" href="#top"></a>
    <div class="runtime" id="runtime" aria-hidden="true"><i class="runtime__dot"></i><span id="runtimeTC">00:00:00:00</span></div>
    <nav class="site-nav" id="siteNav" aria-label="Primary">
      <ul id="navList"></ul>
    </nav>
    <div class="tools">
      <button class="icon-btn" id="themeBtn" type="button">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="siteNav"></button>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top" aria-labelledby="heroName"></section>
    <div class="reel" id="reel" aria-hidden="true"></div>
    <section class="section about" id="about" aria-labelledby="aboutTitle"></section>
    <section class="tl" id="timeline" aria-labelledby="tlTitle"></section>
    <section id="iamwar" data-variant="6"></section>
    <section class="section projects" id="projects" aria-labelledby="projTitle"></section>
    <section class="section skills" id="skills" aria-labelledby="skillsTitle"></section>
    <section class="section future" id="future" aria-labelledby="futureTitle"></section>
    <section class="section contact" id="contact" aria-labelledby="contactTitle"></section>
  </main>

  <footer class="footer" id="footer"></footer>

  <!-- Timeline detail view -->
  <dialog class="modal" id="modal" aria-labelledby="modalTitle"></dialog>

  <noscript><p style="padding:2rem;position:relative;z-index:5;color:#fff">This portfolio needs JavaScript to display its content.</p></noscript>

  <!-- Content (single source of truth) -->
  <script src="../shared/data.js"></script>
  <script src="../shared/iamwar.js"></script>
  <!-- Motion libraries (exact versions) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
