<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portfolio — Journey 3D</title>
  <meta name="description" content="University application portfolio">
  <meta name="theme-color" content="#02040a">

  <!-- Fonts: Unbounded (display) + Outfit (text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&family=Unbounded:wght@300..800&display=swap" rel="stylesheet">

  <!-- Three.js (exact version) — loaded lazily by main.js so a failed download falls back to the 2D timeline -->
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>

  <link rel="stylesheet" href="../shared/iamwar.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" id="skipLink" href="#main"></a>

  <canvas class="gl" id="gl" aria-hidden="true"></canvas>
  <div class="veil" id="veil" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="node-tags" id="nodeTags" aria-hidden="true"></div>

  <!-- Loader with real progress (textures + scene build) -->
  <div class="loader" id="loader" role="status" aria-live="polite">
    <div class="loader__helix" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <p class="loader__name" id="loaderName"></p>
    <p class="loader__label" id="loaderLabel"></p>
    <div class="loader__bar" aria-hidden="true"><span id="loaderFill"></span></div>
    <p class="loader__pct" id="loaderPct">0%</p>
    <button class="loader__btn" id="loaderBtn" type="button"></button>
  </div>

  <header class="top" id="top-bar">
    <a class="brand" id="brand" href="#top"><span class="brand__dot" aria-hidden="true"></span><span id="brandText"></span></a>
    <div class="top__tools">
      <button class="pill-btn" id="soundBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
        <span class="sr-only" id="soundLabel"></span>
      </button>
      <button class="pill-btn" id="viewBtn" type="button"></button>
      <button class="pill-btn pill-btn--menu" id="menuBtn" type="button" aria-expanded="false" aria-controls="menu"><span id="menuText"></span><i aria-hidden="true"></i></button>
    </div>
  </header>

  <!-- Chapter menu -->
  <div class="menu" id="menu" role="dialog" aria-modal="true" aria-labelledby="menuTitle" hidden>
    <h2 class="sr-only" id="menuTitle"></h2>
    <ul class="menu__list" id="navList"></ul>
    <p class="menu__foot" id="menuFoot"></p>
  </div>

  <div class="edge" aria-hidden="true"><span class="edge__thumb" id="edgeThumb"></span><span class="edge__pct" id="edgePct">000</span></div>
  <p class="chapter" id="chapter" aria-hidden="true"></p>

  <main id="main">
    <section class="hero" id="top" aria-labelledby="heroName"></section>
    <section class="section" id="about"></section>
    <section class="runway" id="timeline" aria-labelledby="tlTitle"></section>
    <section id="iamwar" data-variant="5"></section>
    <section class="section" id="projects" aria-labelledby="projTitle"></section>
    <section class="section" id="skills" aria-labelledby="skillsTitle"></section>
    <section class="section" id="future" aria-labelledby="futureTitle"></section>
    <section class="section" id="contact" aria-labelledby="contactTitle"></section>
  </main>

  <footer class="footer" id="footer"></footer>

  <dialog class="modal" id="modal" aria-labelledby="modalTitle"></dialog>

  <noscript><p style="padding:2rem;position:relative;z-index:5">This portfolio needs JavaScript to display its content.</p></noscript>

  <script src="../shared/data.js"></script>
  <script src="../shared/iamwar.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
