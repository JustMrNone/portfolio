<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Aurora</title>
  <meta name="description" content="University application portfolio">
  <meta name="theme-color" content="#f2eefc">

  <!-- Apply the saved / system theme before first paint (no flash) -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('ex2-theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <!-- Fonts: Bricolage Grotesque (display) + Figtree (text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Figtree:wght@300..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../shared/iamwar.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" id="skipLink" href="#main"></a>

  <!-- Animated aurora background (pure CSS, GPU transforms only) -->
  <div class="aurora" aria-hidden="true">
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
  </div>
  <div class="glow" id="glow" aria-hidden="true"></div>

  <!-- Loader -->
  <div class="loader" id="loader" role="status" aria-live="polite">
    <div class="loader__orb" aria-hidden="true">
      <svg viewBox="0 0 120 120" width="180" height="180">
        <circle class="loader__track" cx="60" cy="60" r="52" />
        <circle class="loader__ring" id="loaderRing" cx="60" cy="60" r="52" pathLength="100" />
      </svg>
      <span class="loader__num"><span id="loaderNum">0</span><small>%</small></span>
    </div>
    <p class="loader__name" id="loaderName"></p>
    <p class="loader__label" id="loaderLabel"></p>
    <button class="loader__skip" id="loaderSkip" type="button"></button>
  </div>

  <div class="scrollbar" aria-hidden="true"><span id="progressBar"></span></div>

  <header class="bar" id="header">
    <a class="brand" id="brand" href="#top"><span class="brand__mark" aria-hidden="true"></span><span id="brandText"></span></a>
    <div class="tools">
      <button class="icon-btn" id="themeBtn" type="button">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="dock"></button>
    </div>
  </header>

  <nav class="dock" id="dock" aria-label="Primary">
    <span class="dock__pill" id="dockPill" aria-hidden="true"></span>
    <ul id="navList"></ul>
  </nav>

  <main id="main">
    <section class="hero" id="top" aria-labelledby="heroName"></section>
    <section class="section" id="about"></section>
    <section class="section" id="timeline" aria-labelledby="tlTitle"></section>
    <section id="iamwar" data-variant="2"></section>
    <section class="section" id="projects" aria-labelledby="projTitle"></section>
    <section class="section" id="skills" aria-labelledby="skillsTitle"></section>
    <section class="section" id="future" aria-labelledby="futureTitle"></section>
    <section class="section" id="contact" aria-labelledby="contactTitle"></section>
  </main>

  <footer class="footer" id="footer"></footer>

  <!-- Back-to-top button that doubles as a circular scroll-progress indicator -->
  <button class="to-top" id="toTop" type="button">
    <svg viewBox="0 0 48 48" width="48" height="48" aria-hidden="true">
      <circle class="to-top__track" cx="24" cy="24" r="21" />
      <circle class="to-top__ring" id="toTopRing" cx="24" cy="24" r="21" pathLength="100" />
    </svg>
    <span aria-hidden="true">↑</span>
    <span class="sr-only" id="toTopLabel"></span>
  </button>

  <!-- Timeline detail view -->
  <dialog class="modal" id="modal" aria-labelledby="modalTitle"></dialog>

  <!-- Shared SVG gradient used by the skill rings -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#7c5cff"/><stop offset="55%" stop-color="#ff6fc0"/><stop offset="100%" stop-color="#4fd8c8"/>
      </linearGradient>
    </defs>
  </svg>

  <noscript><p style="padding:2rem">This portfolio needs JavaScript to display its content.</p></noscript>

  <script src="../shared/data.js"></script>
  <script src="../shared/iamwar.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
