<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Neon Grid</title>
  <meta name="description" content="University application portfolio">
  <meta name="theme-color" content="#06080c">

  <!-- Fonts: Space Grotesk (display) + JetBrains Mono (HUD / terminal) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300..700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../shared/iamwar.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" id="skipLink" href="#main"></a>

  <!-- Interactive particle field (canvas) + scanline / noise overlay -->
  <canvas class="field" id="field" aria-hidden="true"></canvas>
  <div class="fx" aria-hidden="true"></div>
  <div class="reticle" id="reticle" aria-hidden="true"><span id="reticleXY">X000 Y000</span></div>

  <!-- Boot loader -->
  <div class="loader" id="loader" role="status" aria-live="polite">
    <div class="loader__box">
      <pre class="loader__log" id="bootLog"></pre>
      <div class="loader__bar" aria-hidden="true"><span id="bootFill"></span></div>
      <div class="loader__foot"><span id="bootPct">000%</span><button class="loader__skip" id="loaderSkip" type="button"></button></div>
    </div>
  </div>

  <!-- Left rail (desktop) / bottom bar (mobile) -->
  <nav class="rail" id="rail" aria-label="Primary">
    <a class="rail__brand" id="brand" href="#top"><span aria-hidden="true">+</span></a>
    <ul class="rail__list" id="navList"></ul>
    <div class="rail__meter" aria-hidden="true"><span id="railFill"></span></div>
    <span class="rail__pct" id="railPct" aria-hidden="true">000</span>
  </nav>

  <main id="main">
    <section class="hero" id="top" aria-labelledby="heroName"></section>
    <section class="section" id="about"></section>
    <section class="section" id="timeline" aria-labelledby="tlTitle"></section>
    <section id="iamwar" data-variant="3"></section>
    <section class="section" id="projects" aria-labelledby="projTitle"></section>
    <section class="section" id="skills" aria-labelledby="skillsTitle"></section>
    <section class="section" id="future" aria-labelledby="futureTitle"></section>
    <section class="section" id="contact" aria-labelledby="contactTitle"></section>
  </main>

  <footer class="statusbar" id="footer"></footer>

  <!-- Timeline detail drawer -->
  <dialog class="drawer" id="modal" aria-labelledby="modalTitle"></dialog>

  <noscript><p style="padding:2rem">This portfolio needs JavaScript to display its content.</p></noscript>

  <script src="../shared/data.js"></script>
  <script src="../shared/iamwar.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
