<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Templates — Choose a direction</title>
  <meta name="description" content="Five university-application portfolio templates built from one shared content file.">
  <meta name="theme-color" content="#0f1115">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0f1115; --card: #171a21; --ink: #f2f0ea; --ink-2: #a9adb8; --line: rgba(255, 255, 255, 0.12); --ease: cubic-bezier(0.16, 1, 0.3, 1); --gutter: clamp(1rem, 4vw, 3rem); }
    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--bg); color-scheme: dark; }
    body { margin: 0; color: var(--ink); font-family: "Inter Tight", system-ui, sans-serif; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: clip; }
    a { color: inherit; }
    ul { list-style: none; margin: 0; padding: 0; }
    h1, h2, p { margin: 0; }
    :focus-visible { outline: 3px solid #7cf; outline-offset: 3px; border-radius: 6px; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .hero { padding: clamp(3rem, 8vw, 6rem) var(--gutter) clamp(2rem, 5vw, 3.5rem); max-width: 1320px; margin-inline: auto; }
    .kicker { display: inline-flex; gap: 0.6rem; align-items: center; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); }
    .kicker::before { content: ""; width: 2rem; height: 1px; background: currentColor; }
    h1 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: clamp(2.6rem, 8vw, 6.5rem); line-height: 0.96; letter-spacing: -0.03em; margin-top: 1rem; max-width: 16ch; }
    h1 em { color: #ff8a5c; }
    .lede { margin-top: 1.4rem; max-width: 56ch; font-size: clamp(1.05rem, 1.6vw, 1.25rem); color: var(--ink-2); }
    .meta { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.6rem; }
    .meta span { padding: 0.35rem 0.85rem; border: 1px solid var(--line); border-radius: 999px; font-size: 0.82rem; color: var(--ink-2); }

    .grid { max-width: 1320px; margin: 0 auto; padding: 0 var(--gutter) 4rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: clamp(1rem, 2.4vw, 1.75rem); }
    .card { position: relative; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; transition: transform 0.7s var(--ease), border-color 0.4s, box-shadow 0.6s; }
    .card:hover { transform: translateY(-6px); border-color: var(--accent); box-shadow: 0 30px 70px -30px var(--accent); }
    .card__preview { position: relative; aspect-ratio: 16 / 10; overflow: hidden; }
    .card__num { position: absolute; top: 0.9rem; left: 1rem; z-index: 3; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; padding: 0.25rem 0.7rem; border-radius: 999px; background: rgba(0, 0, 0, 0.55); color: #fff; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
    .card__body { padding: 1.3rem 1.4rem 1.5rem; display: grid; gap: 0.7rem; flex: 1; align-content: start; }
    .card h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
    .card__tag { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
    .card p { color: var(--ink-2); font-size: 0.95rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .chips li { padding: 0.2rem 0.65rem; border: 1px solid var(--line); border-radius: 999px; font-size: 0.75rem; color: var(--ink-2); }
    .swatches { display: flex; gap: 0.4rem; margin-top: 0.2rem; }
    .swatches i { width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.25); }
    .card__foot { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; margin-top: auto; padding-top: 0.6rem; }
    .fonts { font-size: 0.78rem; color: var(--ink-2); }
    .open { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1.3rem; border-radius: 999px; background: var(--accent); color: #0b0d11; font-weight: 700; font-size: 0.92rem; text-decoration: none; transition: transform 0.5s var(--ease), filter 0.3s; white-space: nowrap; }
    .open:hover { transform: translateX(3px); filter: brightness(1.1); }
    .card a.cover { position: absolute; inset: 0; z-index: 2; border-radius: inherit; }
    .card a.cover:focus-visible { outline-offset: -3px; }
    .open { position: relative; z-index: 3; }

    /* mini previews, each hinting at its template's layout */
    .pv { position: absolute; inset: 0; }
    .pv--1 { background: #f3f0e8; color: #101010; padding: 2.6rem 1.1rem 1.1rem; display: grid; grid-template-rows: auto 1fr auto; font-family: "Instrument Serif", serif; }
    .pv--1 .t { font-size: clamp(2.4rem, 7vw, 3.6rem); line-height: 0.85; letter-spacing: -0.03em; }
    .pv--1 .t i { color: #c8300a; }
    .pv--1 .bar { height: 3px; background: #c8300a; width: 55%; align-self: end; }
    .pv--1 .row { display: flex; gap: 0.5rem; align-self: end; margin-top: 0.8rem; }
    .pv--1 .row span { flex: 1; aspect-ratio: 3 / 4; background: #cfcabb; }
    .pv--1 .row span:nth-child(2) { margin-top: 0.8rem; aspect-ratio: 4 / 3; }
    .pv--2 { background: radial-gradient(circle at 20% 20%, #8b6bff88, transparent 55%), radial-gradient(circle at 80% 30%, #ff7ac688, transparent 55%), radial-gradient(circle at 50% 100%, #5ee0d288, transparent 55%), #1b1838; display: grid; place-items: center; }
    .pv--2 .line { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; background: linear-gradient(#8b6bff, #ff7ac6, #5ee0d2); box-shadow: 0 0 14px #ff7ac6; }
    .pv--2 .g { position: absolute; width: 38%; height: 26%; border-radius: 16px; background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.4); backdrop-filter: blur(8px); }
    .pv--2 .g:nth-child(2) { left: 8%; top: 14%; } .pv--2 .g:nth-child(3) { right: 8%; top: 42%; } .pv--2 .g:nth-child(4) { left: 8%; bottom: 8%; }
    .pv--3 { background: #06080c; padding: 2.6rem 0.8rem 0.8rem; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(3, 1fr); gap: 0.4rem; font-family: ui-monospace, Consolas, monospace; }
    .pv--3 b { border: 1px solid #19f0ff55; background: #0a1018; padding: 0.3rem; font-size: 0.6rem; color: #19f0ff; font-weight: 400; }
    .pv--3 b:nth-child(1) { grid-column: 1 / 4; grid-row: 1 / 3; color: #fff; font-size: 1.2rem; font-weight: 700; } .pv--3 b:nth-child(2) { grid-column: 4 / 6; grid-row: 1 / 4; } .pv--3 b:nth-child(3) { grid-column: 6; border-color: #ff2ea6; color: #ff2ea6; } .pv--3 b:nth-child(4) { grid-column: 1 / 3; grid-row: 3; border-color: #b6ff3c; color: #b6ff3c; } .pv--3 b:nth-child(5) { grid-column: 3 / 4; grid-row: 3; } .pv--3 b:nth-child(6) { grid-column: 6; grid-row: 2 / 4; border-color: #ffb020; color: #ffb020; }
    .pv--4 { background: #fff6e0 radial-gradient(#14121f26 1.5px, transparent 1.5px) 0 0 / 16px 16px; display: flex; align-items: center; justify-content: center; gap: 0.4rem; }
    .pv--4 i { width: 2.6rem; height: 3.2rem; border: 3px solid #14121f; border-radius: 8px; box-shadow: 4px 4px 0 #14121f; display: grid; place-items: center; font: 400 1.7rem "Instrument Serif", serif; color: #14121f; font-style: normal; font-weight: 800; }
    .pv--4 i:nth-child(odd) { rotate: -4deg; } .pv--4 i:nth-child(even) { rotate: 3deg; translate: 0 6px; }
    .pv--4 .tape { position: absolute; left: -5%; right: -5%; bottom: 14%; height: 1.5rem; background: #ffd23f; border-block: 3px solid #14121f; rotate: -3deg; }
    .pv--5 { background: radial-gradient(circle at 50% 50%, #0e2036, #02040a 70%); overflow: hidden; }
    .pv--5 i { position: absolute; width: 0.55rem; height: 0.55rem; border-radius: 50%; left: calc(var(--x) * 1%); top: calc(var(--y) * 1%); background: var(--c); box-shadow: 0 0 12px var(--c); animation: wob 3s ease-in-out infinite alternate; animation-delay: calc(var(--x) * -0.05s); }
    @keyframes wob { to { transform: translateY(14px) scale(1.3); } }

    .foot { max-width: 1320px; margin: 0 auto; padding: 0 var(--gutter) 4rem; display: grid; gap: 0.7rem; color: var(--ink-2); font-size: 0.92rem; }
    .foot b { color: var(--ink); }
    .foot code { padding: 0.1rem 0.45rem; border-radius: 6px; background: rgba(255, 255, 255, 0.08); font-size: 0.85em; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: 0.001ms !important; } }
  </style>
</head>
<body>
  <header class="hero">
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <ul class="meta" id="meta"></ul>
  </header>

  <main>
    <h2 class="sr-only">Templates</h2>
    <ul class="grid" id="grid"></ul>
  </main>

  <footer class="foot" id="foot"></footer>

  <script src="shared/data.js"></script>
  <script>
    /* The launcher reads the applicant from shared/data.js, so it follows any edit to the content file. */
    const P = portfolio.person;
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const templates = [
      { n: '01', folder: 'ex1', name: 'Editorial', tag: 'Swiss / editorial minimalism', accent: '#ff8a5c',
        desc: 'A printed-magazine feel: big serif type, whitespace and one vermilion accent. Scrolling the timeline moves the page sideways through the years while a giant year counter ticks.',
        chips: ['Horizontal timeline', 'Dark / light', 'Text reveals', 'Custom cursor'], swatches: ['#f3f0e8', '#101010', '#c8300a'], fonts: 'Instrument Serif · Inter Tight',
        pv: '<div class="pv pv--1"><div class="t">Noor<br><i>Alvarez</i></div><div class="row"><span></span><span></span><span></span></div><div class="bar"></div></div>' },
      { n: '02', folder: 'ex2', name: 'Aurora', tag: 'Glassmorphism + soft gradients', accent: '#b9a4ff',
        desc: 'Dreamy frosted-glass cards float over a moving aurora. A glowing line draws itself down the page, cards tilt toward the cursor, and skills appear as animated rings.',
        chips: ['Vertical timeline', 'Dark / light', 'Glass cards', 'Cursor glow'], swatches: ['#f2eefc', '#8b6bff', '#ff7ac6', '#5ee0d2'], fonts: 'Bricolage Grotesque · Figtree',
        pv: '<div class="pv pv--2"><span class="line"></span><i class="g"></i><i class="g"></i><i class="g"></i></div>' },
      { n: '03', folder: 'ex3', name: 'Neon Grid', tag: 'Dark futuristic HUD', accent: '#19f0ff',
        desc: 'A bento-grid control room with a live ECG monitor, a particle field that reacts to the mouse, a terminal that types each life event and decoding text, all under scanlines.',
        chips: ['Mission-log timeline', 'Bento hero', 'Typewriter + decode', 'Particle canvas'], swatches: ['#06080c', '#19f0ff', '#ff2ea6', '#b6ff3c'], fonts: 'Space Grotesk · JetBrains Mono',
        pv: '<div class="pv pv--3"><b>NOOR</b><b>ECG</b><b>72</b><b>ONLINE</b><b>▮▮▮▯</b><b>320+</b></div>' },
      { n: '04', folder: 'ex4', name: 'Playful', tag: 'Neo-brutalism scrapbook', accent: '#ffd23f',
        desc: 'Thick outlines, hard shadows, tape and stickers. Drag the polaroids, follow the hand-drawn path with a little walker, flip the project cards and set off confetti on every milestone.',
        chips: ['Winding SVG path', 'Dark / light', 'Draggable polaroids', 'Confetti'], swatches: ['#fff6e0', '#ffd23f', '#ff6b9d', '#4d8dff'], fonts: 'Bowlby One · Fredoka · Caveat',
        pv: '<div class="pv pv--4"><i>N</i><i>O</i><i>O</i><i>R</i><span class="tape"></span></div>' },
      { n: '05', folder: 'ex5', name: 'Journey 3D', tag: 'Immersive WebGL', accent: '#52e5ff',
        desc: 'Your life is a glowing DNA helix and the camera flies along it as you scroll. Each milestone is a node with its own arrival panel. Bloom, heartbeat pulse and a built-in simple-list fallback.',
        chips: ['Three.js flythrough', 'Bloom + loader', '2D fallback', 'Optional heartbeat'], swatches: ['#02040a', '#52e5ff', '#9b7bff', '#ff5fa8'], fonts: 'Unbounded · Outfit',
        pv: '<div class="pv pv--5">' + Array.from({ length: 22 }, (_, i) => `<i style="--x:${10 + (i * 37) % 80};--y:${8 + (i * 53) % 80};--c:${['#52e5ff', '#ff5fa8', '#9b7bff'][i % 3]}"></i>`).join('') + '</div>' }
    ];

    document.title = `Portfolio templates — ${P.name}`;
    document.getElementById('kicker').textContent = `${P.degree} · application`;
    document.getElementById('title').innerHTML = `Five ways to tell <em>${esc(P.name.split(' ')[0])}'s</em> story.`;
    document.getElementById('lede').textContent = `Every template renders the same content from one file, shared/data.js. Open each one, compare the feel, and choose the direction for the final portfolio.`;
    document.getElementById('meta').innerHTML = ['Plain HTML · CSS · JS', 'GSAP + Lenis (+ Three.js in 05)', 'Responsive 360px → 1440px+', 'Keyboard + reduced-motion friendly'].map((t) => `<span>${esc(t)}</span>`).join('');

    document.getElementById('grid').innerHTML = templates.map((t) => `
      <li class="card" style="--accent:${t.accent}">
        <div class="card__preview"><span class="card__num">${t.n}</span>${t.pv}</div>
        <div class="card__body">
          <p class="card__tag">${esc(t.tag)}</p>
          <h2>${esc(t.name)}</h2>
          <p>${esc(t.desc)}</p>
          <ul class="chips">${t.chips.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>
          <ul class="swatches" aria-label="Colour palette">${t.swatches.map((c) => `<li><i style="background:${c}" title="${c}"></i></li>`).join('')}</ul>
          <div class="card__foot"><span class="fonts">${esc(t.fonts)}</span><a class="open" href="${t.folder}/index.html">Open<span class="sr-only"> ${esc(t.name)}</span> →</a></div>
        </div>
        <a class="cover" href="${t.folder}/index.html" tabindex="-1" aria-hidden="true"></a>
      </li>`).join('');

    document.getElementById('foot').innerHTML = `
      <p><b>Run it:</b> serve this folder with any static server, for example <code>npx serve .</code>, then open the address it prints. Template 05 loads Three.js from a CDN, so it needs a connection.</p>
      <p><b>Edit the content:</b> change text, images, projects, skills and UI copy in <code>shared/data.js</code> — every template updates.</p>`;
  </script>
</body>
</html>
