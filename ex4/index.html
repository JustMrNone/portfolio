<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Playful</title>
  <meta name="description" content="University application portfolio">
  <meta name="theme-color" content="#fff6e0">

  <!-- Apply saved / system theme before first paint -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('ex4-theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <!-- Fonts: Bowlby One (display) + Fredoka (text) + Caveat (handwriting) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Caveat:wght@500..700&family=Fredoka:wght@400..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../shared/iamwar.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" id="skipLink" href="#main"></a>

  <!-- Sticker sprite (flat colours + thick outline, driven by CSS variables) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="s-heart" viewBox="0 0 64 64"><path d="M32 56S6 40 6 22C6 12 13 7 20 7c5 0 9 3 12 8 3-5 7-8 12-8 7 0 14 5 14 15 0 18-26 34-26 34z" fill="var(--c,#ff6b9d)" stroke="var(--line)" stroke-width="4" stroke-linejoin="round"/><path d="M16 20c0-4 3-6 6-6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></symbol>
      <symbol id="s-cross" viewBox="0 0 64 64"><rect x="6" y="24" width="52" height="34" rx="4" fill="var(--c,#35d6a0)" stroke="var(--line)" stroke-width="4" stroke-linejoin="round"/><path d="M6 24 L12 8 L58 14 L56 24Z" fill="#fff" stroke="var(--line)" stroke-width="4" stroke-linejoin="round"/><path d="M20 10 L26 24 M34 12 L40 24 M48 14 L52 24" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/></symbol>
      <symbol id="s-pill" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="var(--c,#ffd23f)" stroke="var(--line)" stroke-width="4"/><circle cx="32" cy="32" r="6" fill="#fff" stroke="var(--line)" stroke-width="3"/><g fill="#fff" stroke="var(--line)" stroke-width="3"><circle cx="32" cy="15" r="5"/><circle cx="32" cy="49" r="5"/><circle cx="15" cy="32" r="5"/><circle cx="49" cy="32" r="5"/></g></symbol>
      <symbol id="s-thermo" viewBox="0 0 64 64"><circle cx="20" cy="16" r="10" fill="#fff" stroke="var(--line)" stroke-width="4"/><circle cx="42" cy="14" r="8" fill="#fff" stroke="var(--line)" stroke-width="4"/><rect x="6" y="26" width="38" height="28" rx="5" fill="var(--c,#ff6b9d)" stroke="var(--line)" stroke-width="4"/><path d="M44 34 L58 26 V54 L44 46Z" fill="#fff" stroke="var(--line)" stroke-width="4" stroke-linejoin="round"/></symbol>
      <symbol id="s-star" viewBox="0 0 64 64"><path d="M32 4l8 18 20 2-15 13 5 20-18-10-18 10 5-20L4 24l20-2z" fill="var(--c,#ffd23f)" stroke="var(--line)" stroke-width="4" stroke-linejoin="round"/></symbol>
      <symbol id="s-steth" viewBox="0 0 64 64"><path d="M10 24 H22 L50 8 V56 L22 40 H10Z" fill="var(--c,#4d8dff)" stroke="var(--line)" stroke-width="4" stroke-linejoin="round"/><path d="M16 40 L20 56 H28 L25 42" fill="#fff" stroke="var(--line)" stroke-width="4" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  <div class="sparks" id="sparks" aria-hidden="true"></div>

  <!-- Loader: a film strip fills up, then colour stripes sweep away -->
  <div class="loader" id="loader" role="status" aria-live="polite">
    <div class="loader__stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="loader__content" id="loaderContent">
      <svg class="loader__capsule" viewBox="0 0 260 110" width="260" height="110" aria-hidden="true">
        <defs><clipPath id="capClip"><rect x="6" y="6" width="248" height="98" rx="12"/></clipPath></defs>
        <rect x="6" y="6" width="248" height="98" rx="12" fill="#fff" />
        <g clip-path="url(#capClip)"><rect id="capFill" x="-260" y="0" width="260" height="110" fill="var(--pink)"/><g fill="#14121f"><rect x="16" y="12" width="9" height="8" rx="2"/><rect x="16" y="90" width="9" height="8" rx="2"/><rect x="35" y="12" width="9" height="8" rx="2"/><rect x="35" y="90" width="9" height="8" rx="2"/><rect x="54" y="12" width="9" height="8" rx="2"/><rect x="54" y="90" width="9" height="8" rx="2"/><rect x="73" y="12" width="9" height="8" rx="2"/><rect x="73" y="90" width="9" height="8" rx="2"/><rect x="92" y="12" width="9" height="8" rx="2"/><rect x="92" y="90" width="9" height="8" rx="2"/><rect x="111" y="12" width="9" height="8" rx="2"/><rect x="111" y="90" width="9" height="8" rx="2"/><rect x="130" y="12" width="9" height="8" rx="2"/><rect x="130" y="90" width="9" height="8" rx="2"/><rect x="149" y="12" width="9" height="8" rx="2"/><rect x="149" y="90" width="9" height="8" rx="2"/><rect x="168" y="12" width="9" height="8" rx="2"/><rect x="168" y="90" width="9" height="8" rx="2"/><rect x="187" y="12" width="9" height="8" rx="2"/><rect x="187" y="90" width="9" height="8" rx="2"/><rect x="206" y="12" width="9" height="8" rx="2"/><rect x="206" y="90" width="9" height="8" rx="2"/><rect x="225" y="12" width="9" height="8" rx="2"/><rect x="225" y="90" width="9" height="8" rx="2"/></g></g>
        <rect x="6" y="6" width="248" height="98" rx="12" fill="none" stroke="#14121f" stroke-width="6"/>
      </svg>
      <p class="loader__num"><span id="loaderNum">0</span>%</p>
      <p class="loader__label" id="loaderLabel"></p>
      <button class="loader__skip" id="loaderSkip" type="button"></button>
    </div>
  </div>

  <!-- Scroll progress: a heart rides the bar -->
  <div class="topbar" aria-hidden="true"><span class="topbar__fill" id="progressFill"></span><svg class="topbar__rider" id="progressRider" width="26" height="26"><use href="#s-heart"/></svg></div>

  <header class="nav" id="header">
    <a class="brand" id="brand" href="#top"><svg width="30" height="30" aria-hidden="true"><use href="#s-steth"/></svg><span id="brandText"></span></a>
    <nav class="nav__menu" id="navMenu" aria-label="Primary"><ul id="navList"></ul></nav>
    <div class="nav__tools">
      <button class="sticker-btn" id="themeBtn" type="button">
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="sticker-btn sticker-btn--text" id="menuBtn" type="button" aria-expanded="false" aria-controls="navMenu"></button>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top" aria-labelledby="heroName"></section>
    <section class="section" id="about"></section>
    <section class="section" id="timeline" aria-labelledby="tlTitle"></section>
    <section id="iamwar" data-variant="4"></section>
    <section class="section" id="projects" aria-labelledby="projTitle"></section>
    <section class="section" id="skills" aria-labelledby="skillsTitle"></section>
    <section class="section" id="future" aria-labelledby="futureTitle"></section>
    <section class="section" id="contact" aria-labelledby="contactTitle"></section>
  </main>

  <footer class="footer" id="footer"></footer>

  <!-- Timeline detail -->
  <dialog class="modal" id="modal" aria-labelledby="modalTitle"></dialog>

  <noscript><p style="padding:2rem">This portfolio needs JavaScript to display its content.</p></noscript>

  <script src="../shared/data.js"></script>
  <script src="../shared/iamwar.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
