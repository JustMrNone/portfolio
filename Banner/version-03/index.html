<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I AM WAR — 03 Horizon</title>
  <meta name="description" content="I AM WAR — a documentary about the human consequences of political decisions. Version 03: Horizon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="banner" id="banner">

    <!-- Field: the horizon photograph, split into a back and a front layer -->
    <div class="field" aria-hidden="true">
      <img class="field__back" src="../images/web/figure.webp" width="2400" height="1600" alt="" fetchpriority="high">
      <div class="mist"></div>
      <img class="field__front" src="../images/web/figure-fg.webp" width="2400" height="1600" alt="">
    </div>

    <h1 class="title">I AM WAR</h1>

    <!-- Pieces of the collage -->
    <figure class="piece piece--friends">
      <img src="../images/web/friends.webp" width="604" height="402" alt="A group of friends in a living room, each holding a sheet of paper.">
    </figure>
    <figure class="piece piece--hand">
      <img src="../images/web/ring.webp" width="2400" height="3200" alt="A hand with iridescent nails wearing a gold ring in the shape of a map.">
    </figure>
    <figure class="piece piece--plate">
      <img src="../images/web/plate.webp" width="1600" height="1548" alt="An engraved memorial plate with a young man's portrait and calligraphy.">
    </figure>

    <!-- Photo strip -->
    <ul class="strip">
      <li style="--bg:url(../images/web/dancer-a.webp)"></li>
      <li style="--bg:url(../images/web/bonfire.webp)"></li>
      <li style="--bg:url(../images/web/leap.webp)"></li>
      <li style="--bg:url(../images/web/child.webp);--pos:50% 40%"></li>
      <li style="--bg:url(../images/web/s-guernica-woman.webp);--pos:50% 22%"></li>
      <li style="--bg:url(../images/web/rig.webp)"></li>
    </ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
